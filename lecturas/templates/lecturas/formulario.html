{% extends "Proyectowebapp/base.html" %}

{% load static %}

{% block content %}

<div>
    <p>

    </p>
</div>
<div class="content container">
<form class="row g-3">
  <div class="col-md-6">
    <label for="inputEmail4" class="form-label" style="color: white;">Email</label>
    <input type="email" class="form-control" id="inputEmail4">
  </div>
  <div class="col-md-6">
    <label for="inputPassword4" class="form-label" style="color: white;">Password</label>
    <input type="password" class="form-control" id="inputPassword4">
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label" style="color: white;">Address</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label" style="color: white;">Address 2</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
  </div>
  <div class="col-md-6">
    <label for="inputCity" class="form-label" style="color: white;">City</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="col-md-4">
    <label for="inputState" class="form-label" style="color: white;">State</label>
    <select id="inputState" class="form-select" style="color: white;">
      <option selected>Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-2">
    <label for="inputZip" class="form-label" style="color: white;">Zip</label>
    <input type="text" class="form-control" style="color: white;" id="inputZip">
  </div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" style="color: white;" id="gridCheck">
      <label class="form-check-label" for="gridCheck"> 
        Check me out
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Sign in</button>
  </div>
</form>
</div>
{% endblock %}
